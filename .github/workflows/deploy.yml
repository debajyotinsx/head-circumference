name: Deploy head circumference app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::shinylive
          cache-version: 1
      - name: Export app
        shell: Rscript {0}
        run: |
          dir.create('build-app')
          file.copy(c('app.R', 'tab_hcfa_boys_p_0_5.csv', 'tab_hcfa_girls_p_0_5.csv'), 'build-app')
          shinylive::export('build-app', 'site')
          file.create('site/.nojekyll')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
